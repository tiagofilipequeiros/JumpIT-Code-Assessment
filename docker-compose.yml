services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Dev_Password123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Dev_Password123!" -C -Q "SELECT 1" -b
      interval: 10s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    environment:
      ConnectionStrings__Default: "Server=db,1433;Database=ProductsDb;User Id=sa;Password=Dev_Password123!;TrustServerCertificate=True"
      # ~90 days of demo activity for the Metrics tab, generated once on the first start.
      Seeding__DemoActivity: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_URL: "http://backend:8080"
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  sqlserver-data:
