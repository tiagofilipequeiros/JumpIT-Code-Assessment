name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Unit, integration and acceptance tests. Docker is available on the runner, so Testcontainers can start SQL Server.
      - run: dotnet test

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --watch=false
      - run: npm run build

  stack:
    name: Full stack (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start database, API and frontend
        run: docker compose up -d --build
      - name: Check that everything answers
        run: |
          # The API answers 503 until the database is up and migrated.
          for attempt in $(seq 1 60); do
            curl -fs http://localhost:4200/api/health | grep -q '"database":"ok"' && break
            sleep 5
          done
          curl -fs http://localhost:4200/api/health
          curl -fs http://localhost:4200/ | grep -q '<app-root>'
          curl -fs http://localhost:8080/docs/index.html > /dev/null
          # Seeded data: 10 products are visible to everyone.
          test "$(curl -fs http://localhost:4200/api/products | jq length)" -eq 10
      - name: Logs
        if: failure()
        run: docker compose logs
